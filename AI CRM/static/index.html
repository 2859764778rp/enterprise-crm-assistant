<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CRM 智能助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: #f0f2f5; height: 100vh; display: flex;
           align-items: center; justify-content: center; }
    .app { width: 720px; max-width: 96vw; height: 88vh; background: #fff;
           border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
           display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 16px 20px; background: linear-gradient(135deg,#4f6ef7,#7c3aed);
              color: #fff; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; }
    .phone-box { margin-left: auto; display: flex; align-items: center; gap: 6px;
                 font-size: 13px; }
    .phone-box input { border: none; border-radius: 6px; padding: 5px 8px;
                       width: 130px; font-size: 13px; }
    .chat { flex: 1; padding: 20px; overflow-y: auto; background: #f7f8fa; }
    .msg { margin-bottom: 16px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px;
              line-height: 1.6; white-space: pre-wrap; word-break: break-word;
              font-size: 15px; }
    .msg.user .bubble { background: #4f6ef7; color: #fff; border-bottom-right-radius: 3px; }
    .msg.bot .bubble { background: #fff; color: #222; border: 1px solid #e5e7eb;
                       border-bottom-left-radius: 3px; }
    .meta { font-size: 12px; color: #9ca3af; margin: 0 6px; align-self: flex-end; }
    .input-area { padding: 14px 16px; border-top: 1px solid #eee; display: flex; gap: 10px; }
    .input-area textarea { flex: 1; resize: none; height: 46px; padding: 12px;
                           border: 1px solid #d1d5db; border-radius: 10px;
                           font-size: 15px; font-family: inherit; }
    .input-area button { padding: 0 22px; border: none; border-radius: 10px;
                         background: #4f6ef7; color: #fff; font-size: 15px;
                         cursor: pointer; transition: .2s; }
    .input-area button:hover { background: #3b56d4; }
    .input-area button:disabled { background: #b6bfe8; cursor: not-allowed; }
    .tip { font-size: 12px; color: #9ca3af; padding: 0 16px 10px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <span style="font-size:22px">🤖</span>
      <h1>AI CRM 智能助手</h1>
      <div class="phone-box">
        手机号<input id="phone" value="13800000000" />
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="tip">试试：AI工程师就业前景怎么样 / 课程多少钱 / 帮我查我聊过几条消息</div>
    <div class="input-area">
      <textarea id="input" placeholder="输入消息，回车发送，Shift+回车换行 ..."></textarea>
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const phoneEl = document.getElementById('phone');

    function addBubble(text, who) {
      const row = document.createElement('div');
      row.className = 'msg ' + who;
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      row.appendChild(b);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return b;
    }

    async function send() {
      const text = input.value.trim();
      const phone = phoneEl.value.trim();
      if (!text) return;
      if (!phone) { alert('请先填写手机号'); return; }

      addBubble(text, 'user');
      input.value = '';
      sendBtn.disabled = true;
      const botBubble = addBubble('', 'bot');
      botBubble.textContent = '思考中…';

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phone, query: text })
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', full = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const obj = JSON.parse(line);
            if (obj.delta) { full += obj.delta; botBubble.textContent = full; }
            else if (obj.error) { botBubble.textContent = '出错：' + obj.error; }
            chat.scrollTop = chat.scrollHeight;
          }
        }
        if (!full) botBubble.textContent = '(无回复)';
      } catch (e) {
        botBubble.textContent = '请求失败：' + e.message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
